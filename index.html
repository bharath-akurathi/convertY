<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="logo.svg" />
    <link rel="apple-touch-icon" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Convert, compress and edit files entirely in your browser. Files never leave your device."
    />
    <title>convertY — Free in-browser file converter</title>
  </head>
  <body class="min-h-screen min-w-80 bg-slate-50 dark:bg-slate-900">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="mx-auto" id="root">
      <div
        style="display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:system-ui,-apple-system,sans-serif;color:#475569;"
      >
        <div
          style="width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#0f172a;border-radius:50%;animation:converty-spin 1s linear infinite;"
          role="status"
          aria-label="Loading convertY"
        ></div>
        <p style="margin:0;font-size:15px;">Loading convertY…</p>
      </div>
      <style>
        @keyframes converty-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
